name: Style

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]


  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Black Check
        shell: bash
        run: uvx black . --diff --color --check

      - name: ruff Check
        shell: bash
        run: uvx ruff check src tests

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      # Backends whose packages install on a CPU runner; the others are listed in
      # [tool.ty.analysis] allowed-unresolved-imports.
      - name: Install dependencies
        shell: bash
        run: uv sync --extra finufft --extra cufinufft --extra autodiff --extra torchkbnufft --extra sigpy --extra pynufft --extra io --extra extra

      - name: ty Check
        shell: bash
        run: uvx ty check --output-format github
