name: Release on PyPi

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
jobs:
  gh-release:
    name: Draft the GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Extract the release notes from the changelog
      run: python3 tools/release.py notes "${GITHUB_REF_NAME#v}" > release-notes.md
    - name: Create the draft release
      run: >
        gh release create "$GITHUB_REF_NAME" --draft --verify-tag
        --notes-file release-notes.md --generate-notes

  build-n-publish:
    name: Build and publish to PyPI
    # Without a changelog section for the tag, nothing is published.
    needs: gh-release
    runs-on: ubuntu-latest
    environment: pypi-release
    permissions:
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Get history and tags for SCM versioning to work
      run: |
        git fetch --prune --unshallow
        git fetch --depth=1 origin +refs/tags/*:refs/tags/*
    - name: Set up Python 3.10
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Install pypa/build
      run: python -m pip install build

    - name: Build a binary wheel and a source tarball
      run: |
        python -m build --sdist --wheel --outdir dist/ .

    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
