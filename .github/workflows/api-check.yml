name: API check

# Flags changes of the public API since the latest release that can break
# downstream code (removed objects, moved parameters, changed defaults...).
# Go through a deprecation (see mrinufft/_deprecation.py), or acknowledge the
# change in .github/api-breaks.txt.

on:
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  griffe-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Check for breaking changes since the latest release
        run: .github/check_api.sh
